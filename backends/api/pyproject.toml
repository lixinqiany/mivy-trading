[project]
name = "mivy-api"
version = "0.1.0"
description = "Web API service for Mivy Trading"
readme = "README.md"
authors = [
    { name = "lixinqiany", email = "yulixinqian805@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mivy-contracts",
    "mivy-sdk",
]

[project.scripts]
mivy-api = "mivy_api.__main__:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
mivy-contracts = { workspace = true }
mivy-sdk = { workspace = true }
