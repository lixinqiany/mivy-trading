[project]
name = "mivy-data-crawling"
version = "0.1.0"
description = "Data crawling and persistence service for Mivy Trading"
readme = "README.md"
authors = [
    { name = "lixinqiany", email = "lixinqiany@student.unimelb.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "mivy-contracts",
    "mivy-sdk",
]

[project.scripts]
mivy-data-crawling = "mivy_data_crawling.__main__:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
mivy-contracts = { workspace = true }
mivy-sdk = { workspace = true }
