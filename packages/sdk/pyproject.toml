[project]
name = "mivy-sdk"
version = "0.1.0"
description = "Shared interfaces and algorithms for Mivy Trading services"
readme = "README.md"
authors = [
    { name = "lixinqiany", email = "yulixinqian805@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mivy-contracts",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
mivy-contracts = { workspace = true }
