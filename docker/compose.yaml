name: mivy-trading

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB Not Found}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER Not Found}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD Not Found}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in the root .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
