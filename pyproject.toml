[project]
name = "mivy-trading"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "backends/data_crawling",
    "backends/api",
    "packages/contracts",
    "packages/sdk",
]

[dependency-groups]
dev = [
    "alembic>=1.16,<2",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "lxml>=6.1.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "mivy-contracts",
    "mivy-sdk",
    "mypy>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "pre-commit>=4,<5",
    "ruff>=0.11,<1",
]

[tool.uv.sources]
mivy-contracts = { workspace = true }
mivy-sdk = { workspace = true }

[tool.ruff]
target-version = "py312"
src = [
    "packages/sdk/src",
    "packages/contracts/src",
    "backends/api/src",
    "backends/data_crawling/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/sdk/src",
    "packages/contracts/src",
    "backends/api/src",
    "backends/data_crawling/src",
]
